[package]
name = "price_hunter"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pricehunter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
csv = "1"
dirs = "6"
ego-tree = "0.11"
env_logger = "0.11"
log = "0.4"
pocketbase-sdk = { git = "https://github.com/sreedevk/pocketbase-sdk-rust", tag = "0.4.0" }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
termios = "0.3"
thiserror = "2"
thirtyfour = "0.37"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
toml = "0.8"
ureq = "2"
url = "2"

[dev-dependencies]

[lints.clippy]
cognitive_complexity = "deny"
