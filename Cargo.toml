[package]
name = "price_hunter"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pricehunter"
path = "src/main.rs"

[dependencies]
ego-tree = "0.11"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thirtyfour = "0.37"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
ureq = "2"

[lints.clippy]
cognitive_complexity = "deny"
