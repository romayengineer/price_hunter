<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <main id="wrapper">
            <header class="header">
                Shop header
            </header>
            <section class="promo-banner">
                <span class="banner-price">$ 99.999</span> limited offer
            </section>
            <div class="outer-wrapper">
                <div class="vtex-flex-layout-0-x-flexRow--contenedor-precios">{% for product in products %}<section class="{{ product.card_class }}"><a href="{{ product.href }}">{{ product.name }}</a>
                    <div class="price">
                        <span class="price-wrapper" data-price-type="finalPrice"><span class="price">$&nbsp;{{ product.price_text }}</span></span><span class="price-wrapper" data-price-type="basePrice"><span class="price">$&nbsp;{{ product.price_text }}</span></span>
                    </div>
                    </section>
                {% endfor %}
            </div>
        </div>
        <footer class="footer">
            Contact us
        </footer>
    </main>
</body>
</html>
